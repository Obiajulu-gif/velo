name: Apply issue 236 route patch

on:
  push:
    branches:
      - agent/issue-236-escrow-contract-routing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-236-escrow-contract-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch cash routes without reformatting unrelated code
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/api/src/routes/cash.ts')
          text = path.read_text()

          text = text.replace(
              'import type { FastifyInstance } from "fastify";',
              'import type { FastifyInstance, FastifyReply } from "fastify";',
              1,
          )
          text = text.replace(
              'import { CONTRACTS } from "@velo/shared";\n',
              'import {\n'
              '  getEscrowDeployments,\n'
              '  networkFromEnvironment,\n'
              '  resolveEscrowDeployment,\n'
              '  UnsupportedSettlementAssetError,\n'
              '} from "../lib/escrow-registry.js";\n',
              1,
          )
          text = text.replace(
              'const ESCROW_CONTRACT_ID = process.env.ESCROW_CONTRACT_ID ?? CONTRACTS.testnet.escrow;\n'
              'const DEFAULT_TIMEOUT_LEDGERS = 100; // ~15-20 min at Stellar\'s ~5-6s ledger close time\n',
              'const DEFAULT_TIMEOUT_LEDGERS = 100; // ~15-20 min at Stellar\'s ~5-6s ledger close time\n\n'
              'function resolveRequestedEscrow(\n'
              '  settlementAsset: string | undefined,\n'
              '  reply: FastifyReply,\n'
              ') {\n'
              '  try {\n'
              '    return resolveEscrowDeployment(\n'
              '      settlementAsset ?? process.env.ESCROW_DEFAULT_SETTLEMENT_ASSET ?? "USDC",\n'
              '    );\n'
              '  } catch (error) {\n'
              '    if (error instanceof UnsupportedSettlementAssetError) {\n'
              '      reply.code(400).send({\n'
              '        error: "unsupported_settlement_asset",\n'
              '        settlement_asset: error.settlementAsset,\n'
              '        supported_assets: error.supportedAssets,\n'
              '      });\n'
              '      return undefined;\n'
              '    }\n'
              '    throw error;\n'
              '  }\n'
              '}\n\n'
              'function publicEscrowDeployment(deployment: ReturnType<typeof resolveEscrowDeployment>) {\n'
              '  return {\n'
              '    deployment_id: deployment.deploymentId,\n'
              '    contract_id: deployment.contractId,\n'
              '    settlement_asset: deployment.settlementAsset,\n'
              '    version: deployment.version,\n'
              '  };\n'
              '}\n',
              1,
          )

          text = text.replace(
              '  signed_xdr: z.string().optional(),\n});',
              '  signed_xdr: z.string().optional(),\n  settlement_asset: z.string().trim().min(1).optional(),\n});',
              1,
          )

          text = text.replace(
              ' * GET  /api/v1/cash/agents        — find nearby cash providers ($0.001)\n',
              ' * GET  /api/v1/cash/escrow-contracts — discover active and draining escrow deployments\n'
              ' * GET  /api/v1/cash/agents        — find nearby cash providers ($0.001)\n',
              1,
          )

          marker = 'export async function cashRoutes(app: FastifyInstance) {\n'
          discovery = '''export async function cashRoutes(app: FastifyInstance) {
  app.get("/cash/escrow-contracts", async () => {
    const deployments = getEscrowDeployments();
    return {
      network: networkFromEnvironment(),
      default_settlement_asset: process.env.ESCROW_DEFAULT_SETTLEMENT_ASSET ?? "USDC",
      deployments: deployments.map((deployment) => ({
        ...publicEscrowDeployment(deployment),
        status: deployment.status,
        activated_at: deployment.activatedAt,
        replaces: deployment.replaces,
      })),
    };
  });

'''
          if marker not in text:
              raise SystemExit('cashRoutes marker not found')
          text = text.replace(marker, discovery, 1)

          text = text.replace(
              '    secret_hash: z.string().trim().length(64).regex(/^[0-9a-fA-F]+$/),\n  });',
              '    secret_hash: z.string().trim().length(64).regex(/^[0-9a-fA-F]+$/),\n'
              '    settlement_asset: z.string().trim().min(1).optional(),\n'
              '  });',
              1,
          )
          text = text.replace(
              '    contact_info: z.string().optional(),\n  });',
              '    contact_info: z.string().optional(),\n'
              '    settlement_asset: z.string().trim().min(1).optional(),\n'
              '  });',
              1,
          )

          prepare_start = text.index('  app.post<{ Body: z.infer<typeof prepareLockSchema> }>(')
          legacy_start = text.index('  app.post<{ Body: z.infer<typeof cashRequestSchema> }>(')
          get_start = text.index('  app.get<{ Params: { id: string } }>', legacy_start)
          prefix = text[:prepare_start]
          prepare = text[prepare_start:legacy_start]
          legacy = text[legacy_start:get_start]
          suffix = text[get_start:]

          prepare = prepare.replace(
              '      const { seller, buyer, amount_stroops, secret_hash, mode: rawMode, notification_type, contact_info } = body;\n',
              '      const { seller, buyer, amount_stroops, secret_hash, mode: rawMode, notification_type, contact_info, settlement_asset } = body;\n'
              '      const escrowDeployment = resolveRequestedEscrow(settlement_asset, reply);\n'
              '      if (!escrowDeployment) return;\n',
              1,
          )
          legacy = legacy.replace(
              '      const { seller, buyer, amount_stroops, secret_hash, notification_type, contact_info } = body;\n',
              '      const { seller, buyer, amount_stroops, secret_hash, notification_type, contact_info, settlement_asset } = body;\n'
              '      const escrowDeployment = resolveRequestedEscrow(settlement_asset, reply);\n'
              '      if (!escrowDeployment) return;\n',
              1,
          )

          prepare = prepare.replace('ESCROW_CONTRACT_ID', 'escrowDeployment.contractId')
          legacy = legacy.replace('ESCROW_CONTRACT_ID', 'escrowDeployment.contractId')

          metadata = (
              '          contractId: escrowDeployment.contractId,\n'
              '          escrowDeploymentId: escrowDeployment.deploymentId,\n'
              '          settlementAsset: escrowDeployment.settlementAsset,\n'
              '          contractVersion: escrowDeployment.version,\n'
          )
          prepare = prepare.replace(
              '          contractId: escrowDeployment.contractId,\n', metadata
          )
          legacy = legacy.replace(
              '        contractId: escrowDeployment.contractId,\n',
              '        contractId: escrowDeployment.contractId,\n'
              '        escrowDeploymentId: escrowDeployment.deploymentId,\n'
              '        settlementAsset: escrowDeployment.settlementAsset,\n'
              '        contractVersion: escrowDeployment.version,\n',
              1,
          )

          prepare = prepare.replace(
              '          qr_payload: qrPayload,\n          instructions:',
              '          qr_payload: qrPayload,\n'
              '          escrow: publicEscrowDeployment(escrowDeployment),\n'
              '          instructions:',
          )
          legacy = legacy.replace(
              '        qr_payload: qrPayload,\n        instructions:',
              '        qr_payload: qrPayload,\n'
              '        escrow: publicEscrowDeployment(escrowDeployment),\n'
              '        instructions:',
              1,
          )

          text = prefix + prepare + legacy + suffix
          path.write_text(text)
      - name: Commit route changes
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/cash.ts
          git commit -m "feat(api): route new trades by settlement asset"
          git push origin HEAD:agent/issue-236-escrow-contract-routing
